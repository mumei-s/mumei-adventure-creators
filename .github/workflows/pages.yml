name: 名鑑を公開

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: ファイルを取得
        uses: actions/checkout@v4
      - name: JavaScriptを検査
        run: |
          node --check preview-v3/admin-app.js
          node --check preview-v3/admin-persist.js
          node --check preview-v3/admin-ux-v15.js
          node --check preview-v3/admin-manager-v16.js
          node --check preview-v3/admin-fixes-v17.js
          node --check preview-v3/admin-reset-v18.js
          node --check preview-v3/image-input-v16.js
          node --check preview-v3/feature-fixes-v17.js
          node --check preview-v3/owner-return.js
          node --check preview-v3/bootstrap-v13.js
          node --check preview-v3/app-loader.js
          node --check preview-v3/db-loader.js
          cat preview-v3/chunks/app-*.txt > /tmp/mumei-app-combined.js
          node --check /tmp/mumei-app-combined.js
      - name: GitHub Pagesを設定
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: 公開ファイルを準備
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: 公開
        id: deployment
        uses: actions/deploy-pages@v4
