name: 名鑑を公開

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: ファイルを取得
        uses: actions/checkout@v4
      - name: GitHub Pagesを設定
        uses: actions/configure-pages@v5
      - name: 公開ファイルを準備
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: 公開
        id: deployment
        uses: actions/deploy-pages@v4
