name: Tower browser checks
on:
  pull_request:
    paths:
      - 'tower/**'
      - 'halloween-exhibition/preview/diorama-city/**'
      - 'scripts/archive-tower.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify room assignment, facility limits and image retention in a disposable database
        run: |
          sudo systemctl start postgresql
          sudo -u postgres createdb tower_ci
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d tower_ci -c 'create role anon; create role authenticated; create role service_role bypassrls;'
          sudo -u postgres psql -v ON_ERROR_STOP=1 --single-transaction -d tower_ci -f - < tower/supabase/muumei-intake.sql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d tower_ci -f - < tower/tests/intake.sql
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm --prefix halloween ci --no-audit --no-fund
          node --test tower/tests/*.test.mjs scripts/stage-pages.test.mjs
          npm install --prefix "$RUNNER_TEMP/tower-browser" --no-audit --no-fund playwright@1.56.1
      - name: Check enrollment, existing residents and shared facilities
        run: |
          export NODE_PATH="$RUNNER_TEMP/tower-browser/node_modules"
          export BROWSER_EXECUTABLE="$(command -v google-chrome)"
          python3 -m http.server 4173 --bind 127.0.0.1 > "$RUNNER_TEMP/tower-http.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused http://127.0.0.1:4173/tower/ --output /dev/null
          node tower/tests/move-in-browser-flow.cjs
          for test in tower/tests/*browser-flow.cjs; do
            if [[ "$test" != *move-in-browser-flow.cjs ]]; then node "$test"; fi
          done
