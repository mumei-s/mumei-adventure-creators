<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101417">
  <link rel="manifest" href="../../../tower/manifest.webmanifest">
  <meta name="description" content="自分のアバターでカフェ、公園、コンビニ、遊園地を訪ねよう。各スポットにはイラストをつくるプロンプトも用意しています。">
  <title>近未来街区｜Atelier Tower</title>
  <meta property="og:type" content="website">
  <meta property="og:title" content="近未来街区｜Atelier Tower・無名S note">
  <meta property="og:description" content="自分のキャラクターで街を歩き、２枚のイラストとnote記事をつくる。">
  <meta property="og:image" content="https://mumei-s.github.io/mumei-adventure-creators/halloween-exhibition/preview/diorama-city/assets/district.webp">
  <meta name="note:card" content="summary_large_image">
  <link rel="modulepreload" href="./paths.js?v=20261119-scene">
  <link rel="modulepreload" href="./venues.js?v=20261118-city2">
  <link rel="modulepreload" href="../../../tower/facility-floors.js?v=20261118-city2">
  <script type="module" async src="./scene-entry.js?v=20261119-scene"></script>
  <link rel="stylesheet" href="../../../tower/resident-talk.css?v=community1">
  <link rel="stylesheet" href="./district.css?v=20261119-scene">
  <link rel="stylesheet" href="./walk-pad.css?v=2">
  <link rel="stylesheet" href="../../../tower/quality-assist.css?v=202611181820">
  <link rel="stylesheet" href="../../../tower/game-shell.css?v=20261118-city2">
  <script type="module" src="./district.js?v=20261119-handoff"></script>
  <script type="module" src="../../../tower/visit-counter.js?v=20261119-community1"></script>
</head>
<body>
<main id="district" tabindex="-1">
  <header class="bar">
    <div class="return-links"><a class="return" href="../town/?arrival=future-gate"><span aria-hidden="true">←</span> 戻る</a><a href="../../../halloween/">トップ</a></div>
    <div class="title"><span>Atelier Tower</span><h1 id="district-title">近未来街区</h1></div>
    <div class="time-tools">
      <time id="clock" aria-label="街区の時刻">17:40</time>
      <button type="button" id="lighting" aria-label="街の明るさを切り替え">光景 自動</button>
      <button type="button" data-game-settings>メニュー・設定</button>
    </div>
  </header>
  <section id="city-view" class="city-view" tabindex="0" aria-label="街区。方向パッド、矢印キー、または道を選んで移動します。">
    <div id="city-world" class="city-world">
      <div id="district-scene" class="district-scene">
        <img id="city-plate" class="city-plate" alt="中央にガラスとブロンズのマンション、左に高架駅、右に水辺がある近未来街区のジオラマ" width="1536" height="1024" fetchpriority="high" draggable="false">
        <div class="city-lights" aria-hidden="true"></div>
        <canvas id="transit" class="transit" width="1000" height="667" aria-hidden="true"></canvas>
        <div id="city-portal" class="city-portal" aria-hidden="true"></div>
        <div id="street-shops" class="street-shops" role="group" aria-label="乗り物のショップ">
          <img id="shopfront-art" alt="" draggable="false">
          <button type="button" data-shop="car" aria-label="車のショールームに入る"></button>
          <button type="button" data-shop="motorcycle" aria-label="バイク工房に入る"></button>
          <button type="button" data-shop="bicycle" aria-label="自転車店に入る"></button>
        </div>
        <div class="city-cast" aria-hidden="true">
          <img class="cast cast-plaza" data-src="./assets/host-anime-pink.webp" alt="" draggable="false">
          <img class="cast cast-station" data-src="./assets/host-real-gold.webp" alt="" draggable="false">
          <img class="cast cast-waterfront" data-src="./assets/host-anime-gold.webp" alt="" draggable="false">
        </div>
      </div>
      <img id="venue-plate" class="venue-plate" alt="" width="1440" height="960" draggable="false" hidden>
      <div class="park-sky" aria-hidden="true"></div>
      <div id="mirror-reflections" class="mirror-reflections" aria-hidden="true" hidden><span></span><span></span><span></span></div>
      <div id="citizen" class="citizen" hidden>
        <img alt="" hidden draggable="false">
      </div>
      <div id="street-residents" class="street-residents" aria-label="街を歩く住人"></div>
      <div id="locations" class="locations"></div>
    </div>
    <button type="button" id="leave-venue" class="camera leave-venue" hidden>← 街に戻る</button>
    <button type="button" id="shop-directory" class="camera leave-venue" aria-haspopup="dialog">ショップ <small>車・バイク・自転車</small></button>
    <button type="button" id="camera" class="camera" aria-pressed="false">全景を見る</button>
    <div id="motion-controls" class="motion-controls" hidden>
      <button type="button" id="pump-swing">もうひとこぎ</button>
      <button type="button" id="end-motion">遊具から降りる</button>
    </div>
    <details id="destination-menu" class="destination-menu">
      <summary>行き先</summary>
      <nav id="venue-guide" class="venue-guide" aria-label="街区の行き先">
        <button type="button" data-head-to="cafe">カフェへ</button>
        <button type="button" data-head-to="park">公園へ</button>
        <button type="button" data-head-to="shops">乗り物のショップへ</button>
        <button type="button" data-head-to="tower">マンションへ</button>
        <button type="button" data-head-to="marketGate">高架の先へ</button>
        <button type="button" data-head-to="canalGate">運河街区（屋敷・コンビニ・遊園地）</button>
      </nav>
    </details>
    <p id="scene-load-status" class="scene-load-status" role="status" hidden></p>
    <button id="retry-scene" class="camera retry-scene" type="button" hidden>背景を再読み込み</button>
  </section>
  <div class="control-bar">
    <div id="pad-dock"></div>
    <div class="control-info">
      <p id="place-name">結界広場</p>
      <p id="place-note" role="status">道をタップすると歩いて向かいます。</p>
      <div class="spot-actions">
        <button type="button" id="visit" class="visit" disabled>近くを調べる</button>
        <button type="button" id="spot-prompt" class="spot-prompt" hidden>ここでイラストをつくる</button>
      </div>
      <a id="place-link" class="venue-link" hidden></a>
    </div>
    <div id="street-roster" class="street-roster" hidden><label>街の住人 <select aria-label="話しかける住人"></select></label><button type="button">話しかける</button></div>
    <div class="player-info">
      <details class="tower-visits" data-tower-visits><summary>累計訪問 <strong aria-live="polite">—</strong></summary><small>マンションと近未来街区の合計。同じブラウザは日本時間で1日1回です。</small></details>
      <p id="walker-name">アバターを確認中…</p>
      <a id="walker-room" href="../../../tower/#prompt-play">自分のアバターをつくる</a>
      <button id="retry-walker" class="spot-prompt" type="button" hidden>アバターを再読み込み</button>
    </div>
  </div>
  <dialog id="place-dialog" aria-labelledby="place-title">
    <img class="place-image" alt="">
    <div class="place-body">
      <h2 id="place-title"></h2>
      <p id="place-description"></p>
      <button type="button" id="place-create" class="spot-prompt">この景色でイラスト・note記事をつくる</button>
      <form method="dialog"><button type="submit">← 街歩きに戻る</button></form>
    </div>
  </dialog>
  <dialog id="shop-dialog" aria-labelledby="shop-title">
    <div class="place-body"><h2 id="shop-title">街のショップ</h2>
      <img class="shop-directory-art" alt="左から車のショールーム、バイク工房、自転車店" width="960" height="410">
      <div class="shop-doors"><button type="button" data-shop="car">車のショールーム</button><button type="button" data-shop="motorcycle">バイク工房</button><button type="button" data-shop="bicycle">自転車店</button></div>
      <form method="dialog"><button type="submit">← 街歩きに戻る</button></form>
    </div>
  </dialog>
  <dialog id="activity-dialog" aria-labelledby="activity-title">
    <div class="place-body">
      <h2 id="activity-title"></h2>
      <div id="activity-content"></div>
      <p id="activity-message" role="status" hidden></p>
      <form method="dialog"><button type="submit" id="activity-close">← 戻る</button></form>
    </div>
  </dialog>
  <dialog id="spot-dialog" aria-labelledby="spot-title">
    <div class="place-body">
      <h2 id="spot-title"></h2>
      <p id="spot-scene"></p>
      <p id="spot-reference-status" role="status"></p>
      <label class="spot-field">noteクリエイターID（登録済みの場合は自動入力）
        <input id="spot-id" type="text" autocomplete="off" autocapitalize="none" maxlength="160" placeholder="@ID または noteプロフィールのURL">
      </label>
      <label class="spot-field">イラストに描く人物
        <select id="spot-person"><option value="auto">自分のキャラ</option><option value="attachment">別の人物・キャラ</option><option value="none">人物なし</option></select>
      </label>
      <label class="spot-field" id="spot-person-file"><span id="spot-reference-label">人物用の画像（任意・１枚）</span>
        <input id="spot-image" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
      </label>
      <div class="spot-actions"><button type="button" class="spot-prompt" id="spot-save-reference" hidden>登録キャラの画像を保存</button><button type="button" class="spot-prompt" id="spot-reset-reference" hidden>人物の指定を戻す</button></div>
      <img id="spot-image-preview" class="spot-ref-preview" alt="選んだ人物の画像" hidden>
      <label class="spot-field">一緒に描く乗り物・小物
        <select id="spot-item"><option value="auto">自動（自分の登録車両）</option><option value="attachment">添付・同じチャットの物を使う</option><option value="none">入れない</option></select>
      </label>
      <p id="spot-item-status" class="spot-hint" role="status"></p>
      <label class="spot-field" id="spot-item-file">乗り物・小物用の画像（任意・１枚）
        <input id="spot-item-image" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
      </label>
      <div class="spot-actions"><button type="button" class="spot-prompt" id="spot-save-item" hidden>登録車両の画像を保存</button><button type="button" class="spot-prompt" id="spot-reset-item" hidden>乗り物・小物を自動に戻す</button></div>
      <img id="spot-item-preview" class="spot-ref-preview" alt="選んだ乗り物・小物の画像" hidden>
      <label class="spot-field">つくる画像
        <select id="spot-output">
          <option value="set">本文２枚＋記事のサムネイル</option>
          <option value="scene1">最初のイラスト１枚だけ</option>
          <option value="scene2">続きのイラスト２枚目だけ</option>
          <option value="cover">記事のサムネイルだけ</option>
        </select>
      </label>
      <details class="spot-preview">
        <summary>プロンプトを表示</summary>
        <label class="spot-field">コピー用プロンプト
          <textarea id="spot-text" rows="9" readonly></textarea>
        </label>
      </details>
      <button type="button" class="spot-prompt" id="spot-main-prompt">通常のイラスト作成に戻す</button>
      <button type="button" class="visit" id="spot-copy">イラスト作成プロンプトをコピー</button>
      <span id="spot-message" role="status"></span>
      <p id="spot-transfer-hint" class="spot-hint"></p>
      <div id="spot-file-actions" class="spot-actions" hidden>
        <button type="button" class="spot-prompt" id="spot-copy-image">参照画像をコピー</button>
        <button type="button" class="spot-prompt" id="spot-save-images">参照画像を保存</button>
        <button type="button" class="spot-prompt" id="spot-copy-text">文章だけコピー</button>
      </div>
      <details id="spot-article-draft" class="article-draft"><summary>そのままnoteに貼れる記事本文</summary>
        <label>記事原稿（編集できます）<textarea rows="9" aria-label="編集できる記事本文"></textarea></label>
        <button type="button">記事本文をコピー</button><p role="status"></p>
      </details>
      <button type="button" class="visit" id="spot-article">ChatGPTで記事を仕上げるプロンプトをコピー</button>
      <p class="spot-hint">この記事原稿は画像を作る前にも使えます。イラストができたら同じチャットで「記事にする」と送れます。</p>
      <div class="spot-actions">
        <a id="spot-app" class="spot-prompt">アプリ版を開く</a>
        <a class="spot-prompt" href="../../../tower/chatgpt-web.html" target="_blank" rel="noopener">Web版を開く</a>
      </div>
      <div id="spot-card-actions"></div>
      <div id="spot-quality"></div>
      <form method="dialog" class="spot-return"><button type="submit">← 街歩きに戻る</button></form>
    </div>
  </dialog>
  <div id="passage" class="passage" role="status" hidden></div>
  <noscript><p>街区の探索にはJavaScriptが必要です。<a href="../../../tower/">Atelier Towerを訪ねる</a></p></noscript>
</main>
</body>
</html>
