<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101417">
  <meta name="description" content="結界の先に広がる近未来街区。高架を走る電車と水辺を眺め、カフェ、公園、Atelier Towerを訪ねる。">
  <title>近未来街区｜Atelier Tower</title>
  <link rel="preload" as="image" href="./assets/district.webp?v=1">
  <link rel="stylesheet" href="./district.css?v=3">
  <link rel="stylesheet" href="./walk-pad.css?v=1">
  <script type="module" src="./district.js?v=3"></script>
</head>
<body>
<main id="district" tabindex="-1">
  <header class="bar">
    <a class="return" href="../town/?arrival=future-gate"><span aria-hidden="true">←</span> クリエイターエリア</a>
    <div class="title"><span>Atelier Tower</span><h1 id="district-title">近未来街区</h1></div>
    <div class="time-tools">
      <time id="clock" aria-label="街区の時刻">17:40</time>
      <button type="button" id="lighting" aria-label="街の明るさを切り替え">光景 自動</button>
    </div>
  </header>
  <section id="city-view" class="city-view" tabindex="0" aria-label="街区。方向パッド、矢印キー、または道を選んで移動します。">
    <div id="city-world" class="city-world">
      <div id="district-scene" class="district-scene">
        <img id="city-plate" class="city-plate" src="./assets/district.webp?v=1" alt="中央にガラスとブロンズのマンション、左に高架駅、右に水辺がある近未来街区のジオラマ" width="1536" height="1024" fetchpriority="high" draggable="false">
        <div class="city-lights" aria-hidden="true"></div>
        <canvas id="transit" class="transit" width="1000" height="667" aria-hidden="true"></canvas>
        <div id="city-portal" class="city-portal" aria-hidden="true"></div>
        <div class="city-cast" aria-hidden="true">
          <img class="cast cast-plaza" src="./assets/host-anime-pink.webp" alt="" draggable="false">
          <img class="cast cast-station" src="./assets/host-real-gold.webp" alt="" draggable="false">
          <img class="cast cast-waterfront" src="./assets/host-anime-gold.webp" alt="" draggable="false">
        </div>
      </div>
      <img id="venue-plate" class="venue-plate" alt="" width="1440" height="960" draggable="false" hidden>
      <div class="park-sky" aria-hidden="true"></div>
      <div id="citizen" class="citizen">
        <img src="./assets/host-portrait.webp" alt="無名S note" draggable="false">
      </div>
      <div id="locations" class="locations"></div>
    </div>
    <button type="button" id="leave-venue" class="camera leave-venue" hidden>← 街に戻る</button>
    <button type="button" id="camera" class="camera" aria-pressed="false">全景を見る</button>
  </section>
  <div class="control-bar">
    <div id="pad-dock"></div>
    <div class="control-info">
      <p id="place-name">結界広場</p>
      <p id="place-note" role="status">道をタップすると歩いて向かいます。</p>
      <button type="button" id="visit" class="visit" disabled>近くを調べる</button>
      <a id="place-link" class="venue-link" hidden></a>
    </div>
    <div class="player-info">
      <p id="walker-name">無名S note</p>
      <a id="walker-room" href="../../../tower/#prompt-import">自分のアバターで歩く</a>
    </div>
  </div>
  <nav id="venue-guide" class="venue-guide" aria-label="街区の行き先">
    <button type="button" data-head-to="cafe">カフェへ</button>
    <button type="button" data-head-to="park">公園へ</button>
    <button type="button" data-head-to="tower">マンションへ</button>
    <button type="button" data-head-to="marketGate">高架の先へ</button>
    <button type="button" data-head-to="canalGate">運河の向こうへ</button>
  </nav>
  <dialog id="place-dialog" aria-labelledby="place-title">
    <div class="place-image" aria-hidden="true"></div>
    <div class="place-body">
      <h2 id="place-title"></h2>
      <p id="place-description"></p>
      <form method="dialog"><button type="submit">← 街歩きに戻る</button></form>
    </div>
  </dialog>
  <div id="passage" class="passage" role="status" hidden></div>
  <noscript><p>街区の探索にはJavaScriptが必要です。<a href="../../../tower/">Atelier Towerを訪ねる</a></p></noscript>
</main>
</body>
</html>
