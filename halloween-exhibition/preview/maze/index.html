<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090812"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Halloween冒険室"><link rel="apple-touch-icon" href="../assets/atelier-icon-192.png"><title>Halloween冒険室 — 灯りを持って歩く迷宮</title><link rel="stylesheet" href="./style.css?v=20261014-adventure2"><link rel="stylesheet" href="../visitor-preferences.css?v=20261014-adventure2"><link rel="stylesheet" href="../display-mode.css?v=20261014-adventure2"><link rel="stylesheet" href="./stage-2d.css?v=20261014-adventure2"><link rel="stylesheet" href="./rpg-ui.css?v=20261014-adventure2"><script type="module" src="./app.js?v=20261016-music1"></script><link rel="stylesheet" href="./adventure-controls.css?v=20261016-music1"><link rel="stylesheet" href="../safe-navigation.css?v=20261016-fate1"><link rel="stylesheet" href="./ending.css?v=20261015-clear1"></head><body>
<main id="game"><canvas id="world" aria-label="灯りを持って歩くHalloween冒険室"></canvas><canvas id="fallback" hidden aria-label="2D探索マップ。矢印キーか画面の移動ボタンで移動"></canvas><div class="vignette" aria-hidden="true"></div>
<header><a class="brand" href="../?mode=halloween" aria-label="Halloweenの名鑑に戻る"><span>✦</span><b>Halloween冒険室<small>← HALLOWEEN に戻る</small></b></a><nav><button id="list-open">記事一覧</button><button id="map-open">地図</button><button id="tools-open">明るさ・音</button><button id="pause" aria-pressed="false">動き停止</button></nav><button id="menu-open" aria-haspopup="dialog">メニュー</button></header>
<div class="mode-bar"><div id="view-controls" role="group" aria-label="表示を選ぶ"><button id="view-2d" aria-pressed="false">2D・酔いにくい</button><button id="view-3d" aria-pressed="true">3D</button></div><span id="pad-mode-hint">円形パッドで移動・方向転換</span><div id="game-audio-controls"></div></div>
<div class="place"><span id="wing">HALLOWEEN ADVENTURE</span><h1 id="place-title">灯りの交差廊</h1><p id="objective">東の鍵の間を探し、封印された書庫をひらく。</p></div>
<button type="button" id="minimap-open" class="minimap" aria-label="現在位置の地図を拡大" aria-haspopup="dialog"><span class="map-north">北 ↑</span><canvas id="mini" width="340" height="340" aria-hidden="true"></canvas><span>現在地 · 拡大</span></button>
<div id="crosshair" aria-hidden="true">＋</div><div class="nearby"><span id="object-label">歩いて、物語を見つける。</span><button id="battle-open" hidden disabled>近くのモンスターと対戦</button><button id="interact" disabled>近づいて調べる <b>Ｅ</b></button><button id="lantern" aria-pressed="true">ランタン ON</button></div>
<aside class="encounter-help"><strong>モンスターに出会ったら</strong><p>近づいて話しかける。<br>対戦も立ち去るのも自由。</p><button id="creatures-open">6種の居場所</button></aside>
<div id="direction-pad" class="move-pad" role="group" aria-label="円形方向パッド。押したまま指を動かすと方向が変わります" aria-describedby="pad-mode-hint"><i class="pad-nub" aria-hidden="true"></i><button data-move="forward" aria-label="前へ進む">↑</button><button data-move="left" aria-label="左へ移動">←</button><button data-move="back" aria-label="後ろへ下がる">↓</button><button data-move="right" aria-label="右へ移動">→</button></div>
<div class="look-pad"><span id="look-hint">LOOK · 画面をドラッグ</span><div><button id="turn-left" aria-label="左を向く">↶</button><button id="turn-right" aria-label="右を向く">↷</button></div></div>
<footer><span id="key-state">◇ 鍵を探す</span><span id="controls-hint">WASDで移動 · ドラッグで視点 · Eで調べる</span><button id="home">迷宮の入口へ</button><a class="exit-link" href="../?return=palace">お城に戻る</a></footer>
<div id="loading" role="status" aria-live="polite"><div class="maze-loading-art" aria-hidden="true"><img class="maze-loading-hall" src="./assets/rpg/battle-library.webp" alt="" fetchpriority="high"><img class="maze-loading-ghost" src="./assets/rpg/ghost.webp" alt=""><img class="maze-loading-keeper" src="./assets/rpg/franken.webp" alt=""><i class="maze-loading-glow"></i></div><p>迷宮の扉をひらいています…</p></div><p id="toast" role="status" aria-live="polite"></p>
</main>
<dialog id="panel" aria-labelledby="panel-title"><button class="close safe-dialog-back" aria-label="閉じて探索に戻る">← 探索に戻る</button><div id="panel-content"></div></dialog>
<noscript><p>探索にはJavaScriptが必要です。<a href="../?mode=halloween">通常・Halloweenの名鑑に戻れます。</a></p></noscript>
</body></html>
