<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="diagram-title diagram-desc" data-diagram-kind="pitch"><title id="diagram-title">目線の高さ・正面：横から見たカメラ配置</title><desc id="diagram-desc">カメラと構図の技術図。主題は箱で示す。pitch=0° / yaw=0°。人物・画風・完成投影の作画見本ではありません。</desc><rect width="1000" height="760" rx="18" fill="#f8fbfe"/><text x="38" y="52" font-size="31" fill="#233a52" text-anchor="start" font-family="sans-serif">目線の高さ・正面</text><text x="38" y="92" font-size="23" fill="#536b80" text-anchor="start" font-family="sans-serif">横から見たカメラ配置 / カメラ・構図の技術図</text><rect id="subject-shape" x="330" y="315" width="120" height="100" rx="4" fill="#dce8f1" stroke="#233a52" stroke-width="3"/><line x1="240" y1="365" x2="740" y2="365" stroke="#536b80" stroke-width="4" stroke-dasharray="9 7"/><text x="750" y="373" font-size="23" fill="#536b80" text-anchor="start" font-family="sans-serif">水平</text><line id="optical-axis" x1="595" y1="365" x2="390" y2="365" stroke="#066e99" stroke-width="4"/><circle cx="390" cy="365" r="7" fill="#d38122"/><g class="camera-symbol" transform="translate(595 365) rotate(0)"><rect x="-20" y="-15" width="40" height="30" rx="5" fill="#066e99"/><path d="M-20 -7L-33 -15V15L-20 7Z" fill="#066e99"/></g><line id="horizontal-reference" x1="595" y1="365" x2="490" y2="365" stroke="#536b80" stroke-width="4" stroke-dasharray="9 7"/><text x="710" y="255" font-size="31" fill="#066e99" text-anchor="start" font-family="sans-serif">水平 0°</text><text x="710" y="296" font-size="24" fill="#536b80" text-anchor="start" font-family="sans-serif">横から見た光軸</text><text x="325" y="450" font-size="23" fill="#233a52" text-anchor="start" font-family="sans-serif">主題の形</text><text x="632" y="373" font-size="23" fill="#066e99" text-anchor="start" font-family="sans-serif">カメラ</text><text x="175" y="570" font-size="25" fill="#233a52" text-anchor="start" font-family="sans-serif">注視点へ向く光軸と水平線のなす角</text><text x="175" y="610" font-size="23" fill="#536b80" text-anchor="start" font-family="sans-serif">姿勢・接地・遮蔽は今回の選択条件で決める</text><rect x="730" y="385" width="235" height="160" rx="4" fill="#ffffff" stroke="#dce8f1" stroke-width="3"/><rect x="825" y="425" width="40" height="40" rx="4" fill="#dce8f1" stroke="#233a52" stroke-width="3"/><line id="azimuth-axis" x1="845" y1="535" x2="845" y2="450" stroke="#066e99" stroke-width="4"/><g class="camera-symbol" transform="translate(845 535) rotate(90)"><rect x="-20" y="-15" width="40" height="30" rx="5" fill="#066e99"/><path d="M-20 -7L-33 -15V15L-20 7Z" fill="#066e99"/></g><text x="743" y="413" font-size="20" fill="#066e99" text-anchor="start" font-family="sans-serif">上面図：正面 0°</text><text x="38" y="715" font-size="23" fill="#536b80" text-anchor="start" font-family="sans-serif">箱は説明用の主題形。完成作品・人物・画風の見本ではありません。</text></svg>
