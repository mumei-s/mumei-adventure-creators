<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="diagram-title diagram-desc" data-diagram-kind="yaw"><title id="diagram-title">斜め前45度：上から見たカメラ配置</title><desc id="diagram-desc">カメラと構図の技術図。主題は箱で示す。yaw=45°。人物・画風・完成投影の作画見本ではありません。</desc><rect width="1000" height="760" rx="18" fill="#f8fbfe"/><text x="38" y="52" font-size="31" fill="#233a52" text-anchor="start" font-family="sans-serif">斜め前45度</text><text x="38" y="92" font-size="23" fill="#536b80" text-anchor="start" font-family="sans-serif">上から見たカメラ配置 / カメラ・構図の技術図</text><circle cx="445" cy="365" r="205" fill="none" stroke="#dce8f1" stroke-width="3"/><rect id="subject-shape" x="385" y="315" width="120" height="100" rx="4" fill="#dce8f1" stroke="#233a52" stroke-width="3"/><line id="subject-front-axis" x1="445" y1="365" x2="445" y2="570" stroke="#536b80" stroke-width="4" stroke-dasharray="9 7"/><line id="azimuth-axis" x1="589.95689" y1="509.95689" x2="445" y2="365" stroke="#066e99" stroke-width="4"/><circle cx="445" cy="365" r="7" fill="#d38122"/><g class="camera-symbol" transform="translate(589.95689 509.95689) rotate(45)"><rect x="-20" y="-15" width="40" height="30" rx="5" fill="#066e99"/><path d="M-20 -7L-33 -15V15L-20 7Z" fill="#066e99"/></g><text x="385" y="440" font-size="23" fill="#233a52" text-anchor="start" font-family="sans-serif">主題の正面</text><text x="430" y="285" font-size="23" fill="#233a52" text-anchor="start" font-family="sans-serif">背面</text><text x="700" y="360" font-size="23" fill="#233a52" text-anchor="start" font-family="sans-serif">側面</text><text x="680" y="200" font-size="30" fill="#066e99" text-anchor="start" font-family="sans-serif">正面から 45°</text><text x="680" y="242" font-size="23" fill="#536b80" text-anchor="start" font-family="sans-serif">上から見た方位</text><path d="M445,510A145 145 0 0 0 547.530483,467.530483" fill="none" stroke="#d38122" stroke-width="4"/><text x="170" y="625" font-size="23" fill="#536b80" text-anchor="start" font-family="sans-serif">高さや見上げ角はこの図では固定しない</text><text x="38" y="715" font-size="23" fill="#536b80" text-anchor="start" font-family="sans-serif">箱は説明用の主題形。完成作品・人物・画風の見本ではありません。</text></svg>
