<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="diagram-title diagram-desc" data-diagram-kind="position"><title id="diagram-title">肩越しの視点：位置・画角・構造の説明</title><desc id="diagram-desc">カメラと構図の技術図。主題は箱で示す。数値のカメラ軸は未固定。人物・画風・完成投影の作画見本ではありません。</desc><rect width="1000" height="760" rx="18" fill="#f8fbfe"/><text x="38" y="52" font-size="31" fill="#233a52" text-anchor="start" font-family="sans-serif">肩越しの視点</text><text x="38" y="92" font-size="23" fill="#536b80" text-anchor="start" font-family="sans-serif">位置・画角・構造の説明 / カメラ・構図の技術図</text><rect id="image-frame" x="150" y="165" width="700" height="430" rx="4" fill="#ffffff" stroke="#233a52" stroke-width="3"/><rect id="subject-shape" x="490" y="255" width="180" height="275" rx="4" fill="#dce8f1" stroke="#233a52" stroke-width="3"/><rect id="foreground-edge" x="165" y="395" width="270" height="195" rx="4" fill="#233a52" stroke="#233a52" stroke-width="3"/><line x1="280" y1="540" x2="565" y2="325" stroke="#066e99" stroke-width="4" stroke-dasharray="9 7"/><text x="180" y="640" font-size="25" fill="#233a52" text-anchor="start" font-family="sans-serif">手前の縁・奥の対象を同じ視線へつなぐ</text><text x="38" y="715" font-size="23" fill="#536b80" text-anchor="start" font-family="sans-serif">箱は説明用の主題形。完成作品・人物・画風の見本ではありません。</text></svg>
