<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="diagram-title diagram-desc" data-diagram-kind="position"><title id="diagram-title">鳥の目・広い俯瞰：位置・画角・構造の説明</title><desc id="diagram-desc">カメラと構図の技術図。主題は箱で示す。数値のカメラ軸は未固定。人物・画風・完成投影の作画見本ではありません。</desc><rect width="1000" height="760" rx="18" fill="#f8fbfe"/><text x="38" y="52" font-size="31" fill="#233a52" text-anchor="start" font-family="sans-serif">鳥の目・広い俯瞰</text><text x="38" y="92" font-size="23" fill="#536b80" text-anchor="start" font-family="sans-serif">位置・画角・構造の説明 / カメラ・構図の技術図</text><rect id="subject-shape" x="330" y="315" width="120" height="100" rx="4" fill="#dce8f1" stroke="#233a52" stroke-width="3"/><line x1="240" y1="365" x2="740" y2="365" stroke="#536b80" stroke-width="4" stroke-dasharray="9 7"/><text x="750" y="373" font-size="23" fill="#536b80" text-anchor="start" font-family="sans-serif">水平</text><line id="illustrative-optical-axis" x1="521.77146" y1="207.960889" x2="390" y2="365" stroke="#066e99" stroke-width="4"/><circle cx="390" cy="365" r="7" fill="#d38122"/><g class="camera-symbol" transform="translate(521.77146 207.960889) rotate(-50)"><rect x="-20" y="-15" width="40" height="30" rx="5" fill="#066e99"/><path d="M-20 -7L-33 -15V15L-20 7Z" fill="#066e99"/></g><line id="horizontal-reference" x1="521.77146" y1="207.960889" x2="416.77146" y2="207.960889" stroke="#536b80" stroke-width="4" stroke-dasharray="9 7"/><path d="M456.77146,207.960889A65 65 0 0 0 479.990265,257.753778" fill="none" stroke="#d38122" stroke-width="4"/><text x="710" y="255" font-size="31" fill="#066e99" text-anchor="start" font-family="sans-serif">上方からの配置例</text><text x="710" y="296" font-size="24" fill="#536b80" text-anchor="start" font-family="sans-serif">数値角度は未固定</text><text x="325" y="450" font-size="23" fill="#233a52" text-anchor="start" font-family="sans-serif">主題の形</text><text x="558.77146" y="215.960889" font-size="23" fill="#066e99" text-anchor="start" font-family="sans-serif">カメラ</text><text x="175" y="570" font-size="25" fill="#233a52" text-anchor="start" font-family="sans-serif">注視点へ向く光軸と水平線のなす角</text><text x="175" y="610" font-size="23" fill="#536b80" text-anchor="start" font-family="sans-serif">姿勢・接地・遮蔽は今回の選択条件で決める</text><text x="150" y="180" font-size="25" fill="#233a52" text-anchor="start" font-family="sans-serif">広い範囲を見渡す</text><text x="38" y="715" font-size="23" fill="#536b80" text-anchor="start" font-family="sans-serif">箱は説明用の主題形。完成作品・人物・画風の見本ではありません。</text></svg>
