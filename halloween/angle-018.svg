<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="diagram-title diagram-desc" data-diagram-kind="position"><title id="diagram-title">地面すれすれの視点：位置・画角・構造の説明</title><desc id="diagram-desc">カメラと構図の技術図。主題は箱で示す。数値のカメラ軸は未固定。人物・画風・完成投影の作画見本ではありません。</desc><rect width="1000" height="760" rx="18" fill="#f8fbfe"/><text x="38" y="52" font-size="31" fill="#233a52" text-anchor="start" font-family="sans-serif">地面すれすれの視点</text><text x="38" y="92" font-size="23" fill="#536b80" text-anchor="start" font-family="sans-serif">位置・画角・構造の説明 / カメラ・構図の技術図</text><rect id="subject-shape" x="620" y="260" width="125" height="300" rx="4" fill="#dce8f1" stroke="#233a52" stroke-width="3"/><line id="support-surface" x1="170" y1="560" x2="840" y2="560" stroke="#536b80" stroke-width="4"/><line id="illustrative-optical-axis" x1="240" y1="525" x2="680" y2="410" stroke="#066e99" stroke-width="4"/><g class="camera-symbol" transform="translate(240 525) rotate(-15)"><rect x="-20" y="-15" width="40" height="30" rx="5" fill="#066e99"/><path d="M-20 -7L-33 -15V15L-20 7Z" fill="#066e99"/></g><text x="190" y="610" font-size="24" fill="#233a52" text-anchor="start" font-family="sans-serif">支持面近くにカメラ。数値の見上げ角は未固定</text><text x="38" y="715" font-size="23" fill="#536b80" text-anchor="start" font-family="sans-serif">箱は説明用の主題形。完成作品・人物・画風の見本ではありません。</text></svg>
