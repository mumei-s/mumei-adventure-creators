<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="diagram-title diagram-desc" data-diagram-kind="roll"><title id="diagram-title">斜めに傾いた画面・15度：画面軸の回転</title><desc id="diagram-desc">カメラと構図の技術図。主題は箱で示す。roll=15°。人物・画風・完成投影の作画見本ではありません。</desc><rect width="1000" height="760" rx="18" fill="#f8fbfe"/><text x="38" y="52" font-size="31" fill="#233a52" text-anchor="start" font-family="sans-serif">斜めに傾いた画面・15度</text><text x="38" y="92" font-size="23" fill="#536b80" text-anchor="start" font-family="sans-serif">画面軸の回転 / カメラ・構図の技術図</text><rect x="270" y="215" width="460" height="300" rx="4" fill="none" stroke="#dce8f1" stroke-width="3"/><line id="unrotated-reference" x1="220" y1="365" x2="800" y2="365" stroke="#536b80" stroke-width="4" stroke-dasharray="9 7"/><polygon id="rotated-frame" points="316.659917,160.582746 760.985797,279.639506 683.340083,569.417254 239.014203,450.360494" fill="#ffffff" stroke="#066e99" stroke-width="3"/><polygon id="subject-shape" points="472.409232,274.784982 569.001815,300.666886 534.061244,431.066873 437.468661,405.184968" fill="#dce8f1" stroke="#233a52" stroke-width="3"/><line id="screen-horizontal" x1="292.579787" y1="366.362111" x2="678.950118" y2="469.889729" stroke="#d38122" stroke-width="4"/><line id="frame-top-axis" x1="316.659917" y1="160.582746" x2="760.985797" y2="279.639506" stroke="#066e99" stroke-width="4"/><circle cx="500" cy="365" r="7" fill="#d38122"/><path d="M605,365A105 105 0 0 1 601.422212,392.176" fill="none" stroke="#d38122" stroke-width="4"/><text x="145" y="180" font-size="30" fill="#066e99" text-anchor="start" font-family="sans-serif">画面軸まわり 15°</text><text x="155" y="590" font-size="25" fill="#233a52" text-anchor="start" font-family="sans-serif">主題・支持面・背景を同じ画面軸で回す</text><text x="155" y="625" font-size="23" fill="#536b80" text-anchor="start" font-family="sans-serif">カメラの高さ・方位は未固定</text><text x="38" y="715" font-size="23" fill="#536b80" text-anchor="start" font