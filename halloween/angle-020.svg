<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="diagram-title diagram-desc" data-diagram-kind="roll"><title id="diagram-title">大胆な傾斜・30度：画面軸の回転</title><desc id="diagram-desc">カメラと構図の技術図。主題は箱で示す。roll=30°。人物・画風・完成投影の作画見本ではありません。</desc><rect width="1000" height="760" rx="18" fill="#f8fbfe"/><text x="38" y="52" font-size="31" fill="#233a52" text-anchor="start" font-family="sans-serif">大胆な傾斜・30度</text><text x="38" y="92" font-size="23" fill="#536b80" text-anchor="start" font-family="sans-serif">画面軸の回転 / カメラ・構図の技術図</text><rect x="270" y="215" width="460" height="300" rx="4" fill="none" stroke="#dce8f1" stroke-width="3"/><line id="unrotated-reference" x1="220" y1="365" x2="800" y2="365" stroke="#536b80" stroke-width="4" stroke-dasharray="9 7"/><polygon id="rotated-frame" points="375.814157,120.096189 774.185843,350.096189 624.185843,609.903811 225.814157,379.903811" fill="#ffffff" stroke="#066e99" stroke-width="3"/><polygon id="subject-shape" points="496.69873,270.717968 583.30127,320.717968 515.80127,437.631397 429.19873,387.631397" fill="#dce8f1" stroke="#233a52" stroke-width="3"/><line id="screen-horizontal" x1="299.294919" y1="312.631397" x2="645.705081" y2="512.631397" stroke="#d38122" stroke-width="4"/><line id="frame-top-axis" x1="375.814157" y1="120.096189" x2="774.185843" y2="350.096189" stroke="#066e99" stroke-width="4"/><circle cx="500" cy="365" r="7" fill="#d38122"/><path d="M605,365A105 105 0 0 1 590.932667,417.5" fill="none" stroke="#d38122" stroke-width="4"/><text x="145" y="180" font-size="30" fill="#066e99" text-anchor="start" font-family="sans-serif">画面軸まわり 30°</text><text x="155" y="590" font-size="25" fill="#233a52" text-anchor="start" font-family="sans-serif">主題・支持面・背景を同じ画面軸で回す</text><text x="155" y="625" font-size="23" fill="#536b80" text-anchor="start" font-family="sans-serif">カメラの高さ・方位は未固定</text><text x="38" y="715" font-size="23" fill="#536b80" text-anchor="start" font-family="san