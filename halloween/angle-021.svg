<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="diagram-title diagram-desc" data-diagram-kind="crop"><title id="diagram-title">顔のクローズアップ：接写する範囲の説明</title><desc id="diagram-desc">カメラと構図の技術図。主題は箱で示す。数値のカメラ軸は未固定。人物・画風・完成投影の作画見本ではありません。</desc><rect width="1000" height="760" rx="18" fill="#f8fbfe"/><text x="38" y="52" font-size="31" fill="#233a52" text-anchor="start" font-family="sans-serif">顔のクローズアップ</text><text x="38" y="92" font-size="23" fill="#536b80" text-anchor="start" font-family="sans-serif">接写する範囲の説明 / カメラ・構図の技術図</text><rect id="subject-shape" x="190" y="195" width="180" height="365" rx="4" fill="#dce8f1" stroke="#233a52" stroke-width="3"/><rect id="selected-crop" x="215" y="220" width="130" height="105" rx="4" fill="none" stroke="#d38122" stroke-width="3"/><line x1="345" y1="220" x2="510" y2="240" stroke="#d38122" stroke-width="4" stroke-dasharray="9 7"/><line x1="345" y1="325" x2="510" y2="480" stroke="#d38122" stroke-width="4" stroke-dasharray="9 7"/><rect id="detail-frame" x="510" y="240" width="290" height="240" rx="4" fill="#ffffff" stroke="#066e99" stroke-width="3"/><rect x="550" y="285" width="210" height="150" rx="4" fill="#dce8f1" stroke="#233a52" stroke-width="3"/><text x="150" y="615" font-size="25" fill="#233a52" text-anchor="start" font-family="sans-serif">顔に相当する範囲を大きく切り取る</text><text x="150" y="650" font-size="23" fill="#536b80" text-anchor="start" font-family="sans-serif">箱は領域の説明用。顔・手足の作画見本ではない</text><text x="38" y="715" font-size="23" fill="#536b80" text-anchor="start" font-family="sans-serif">箱は説明用の主題形。完成作品・人物・画風の見本ではありません。</text></svg>
