<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="diagram-title diagram-desc" data-diagram-kind="lens"><title id="diagram-title">超広角の遠近：遠近・投影の説明</title><desc id="diagram-desc">カメラと構図の技術図。主題は箱で示す。数値のカメラ軸は未固定。人物・画風・完成投影の作画見本ではありません。</desc><rect width="1000" height="760" rx="18" fill="#f8fbfe"/><text x="38" y="52" font-size="31" fill="#233a52" text-anchor="start" font-family="sans-serif">超広角の遠近</text><text x="38" y="92" font-size="23" fill="#536b80" text-anchor="start" font-family="sans-serif">遠近・投影の説明 / カメラ・構図の技術図</text><rect id="image-frame" x="150" y="165" width="700" height="430" rx="4" fill="#ffffff" stroke="#233a52" stroke-width="3"/><rect id="near-shape" x="240" y="330" width="230" height="235" rx="4" fill="#dce8f1" stroke="#233a52" stroke-width="3"/><rect id="far-shape" x="605" y="245" width="65" height="100" rx="4" fill="#dce8f1" stroke="#233a52" stroke-width="3"/><line x1="180" y1="585" x2="650" y2="220" stroke="#536b80" stroke-width="4" stroke-dasharray="9 7"/><text x="240" y="305" font-size="25" fill="#233a52" text-anchor="start" font-family="sans-serif">近い形は大きく</text><text x="595" y="205" font-size="25" fill="#233a52" text-anchor="start" font-family="sans-serif">奥は小さく</text><text x="175" y="650" font-size="23" fill="#536b80" text-anchor="start" font-family="sans-serif">投影・距離の説明。高さ・方位の数値は未固定</text><text x="38" y="715" font-size="23" fill="#536b80" text-anchor="start" font-family="sans-serif">箱は説明用の主題形。完成作品・人物・画風の見本ではありません。</text></svg>
