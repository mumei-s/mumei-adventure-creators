<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="diagram-title diagram-desc" data-diagram-kind="lens"><title id="diagram-title">望遠・奥行きを圧縮：遠近・投影の説明</title><desc id="diagram-desc">カメラと構図の技術図。主題は箱で示す。数値のカメラ軸は未固定。人物・画風・完成投影の作画見本ではありません。</desc><rect width="1000" height="760" rx="18" fill="#f8fbfe"/><text x="38" y="52" font-size="31" fill="#233a52" text-anchor="start" font-family="sans-serif">望遠・奥行きを圧縮</text><text x="38" y="92" font-size="23" fill="#536b80" text-anchor="start" font-family="sans-serif">遠近・投影の説明 / カメラ・構図の技術図</text><rect id="image-frame" x="150" y="165" width="700" height="430" rx="4" fill="#ffffff" stroke="#233a52" stroke-width="3"/><rect id="near-shape" x="305" y="275" width="155" height="245" rx="4" fill="#dce8f1" stroke="#233a52" stroke-width="3"/><rect id="far-shape" x="470" y="260" width="140" height="225" rx="4" fill="#eff4f8" stroke="#233a52" stroke-width="3"/><text x="265" y="225" font-size="25" fill="#233a52" text-anchor="start" font-family="sans-serif">前後の大きさの差を抑える</text><text x="270" y="565" font-size="23" fill="#536b80" text-anchor="start" font-family="sans-serif">重なりで距離層を分ける</text><text x="175" y="650" font-size="23" fill="#536b80" text-anchor="start" font-family="sans-serif">投影・距離の説明。高さ・方位の数値は未固定</text><text x="38" y="715" font-size="23" fill="#536b80" text-anchor="start" font-family="sans-serif">箱は説明用の主題形。完成作品・人物・画風の見本ではありません。</text></svg>
