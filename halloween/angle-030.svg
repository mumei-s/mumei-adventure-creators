<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="diagram-title diagram-desc" data-diagram-kind="lens"><title id="diagram-title">魚眼の曲面遠近：遠近・投影の説明</title><desc id="diagram-desc">カメラと構図の技術図。主題は箱で示す。数値のカメラ軸は未固定。人物・画風・完成投影の作画見本ではありません。</desc><rect width="1000" height="760" rx="18" fill="#f8fbfe"/><text x="38" y="52" font-size="31" fill="#233a52" text-anchor="start" font-family="sans-serif">魚眼の曲面遠近</text><text x="38" y="92" font-size="23" fill="#536b80" text-anchor="start" font-family="sans-serif">遠近・投影の説明 / カメラ・構図の技術図</text><rect id="image-frame" x="150" y="165" width="700" height="430" rx="4" fill="#ffffff" stroke="#233a52" stroke-width="3"/><path d="M270 190Q362 365 270 570" fill="none" stroke="#536b80" stroke-width="3"/><path d="M380 190Q428 365 380 570" fill="none" stroke="#536b80" stroke-width="3"/><path d="M500 190Q500 365 500 570" fill="none" stroke="#536b80" stroke-width="3"/><path d="M620 190Q572 365 620 570" fill="none" stroke="#536b80" stroke-width="3"/><path d="M730 190Q638 365 730 570" fill="none" stroke="#536b80" stroke-width="3"/><path d="M180 225Q500 155 820 225" fill="none" stroke="#536b80" stroke-width="3"/><path d="M180 305Q500 275 820 305" fill="none" stroke="#536b80" stroke-width="3"/><path d="M180 425Q500 455 820 425" fill="none" stroke="#536b80" stroke-width="3"/><path d="M180 520Q500 597.5 820 520" fill="none" stroke="#536b80" stroke-width="3"/><rect id="subject-shape" x="450" y="305" width="100" height="120" rx="4" fill="#dce8f1" stroke="#233a52" stroke-width="3"/><text x="175" y="650" font-size="23" fill="#536b80" text-anchor="start" font-family="sans-serif">投影・距離の説明。高さ・方位の数値は未固定</text><text x="38" y="715" font-size="23" fill="#536b80" text-anchor="start" font-family="sans-serif">箱は説明用の主題形。完成作品・人物・画風の見本ではありません。</text></svg>
