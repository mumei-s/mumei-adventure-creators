<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="diagram-title diagram-desc" data-diagram-kind="subjective"><title id="diagram-title">主役に向き合う一人称：位置・画角・構造の説明</title><desc id="diagram-desc">カメラと構図の技術図。主題は箱で示す。数値のカメラ軸は未固定。人物・画風・完成投影の作画見本ではありません。</desc><rect width="1000" height="760" rx="18" fill="#f8fbfe"/><text x="38" y="52" font-size="31" fill="#233a52" text-anchor="start" font-family="sans-serif">主役に向き合う一人称</text><text x="38" y="92" font-size="23" fill="#536b80" text-anchor="start" font-family="sans-serif">位置・画角・構造の説明 / カメラ・構図の技術図</text><rect id="image-frame" x="150" y="165" width="700" height="430" rx="4" fill="#ffffff" stroke="#233a52" stroke-width="3"/><rect id="subject-shape" x="360" y="205" width="280" height="365" rx="4" fill="#dce8f1" stroke="#233a52" stroke-width="3"/><text x="180" y="640" font-size="25" fill="#233a52" text-anchor="start" font-family="sans-serif">鑑賞者の目前に主題。未指定の手は追加しない</text><text x="38" y="715" font-size="23" fill="#536b80" text-anchor="start" font-family="sans-serif">箱は説明用の主題形。完成作品・人物・画風の見本ではありません。</text></svg>
