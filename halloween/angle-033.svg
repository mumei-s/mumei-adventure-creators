<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="diagram-title diagram-desc" data-diagram-kind="layout"><title id="diagram-title">水平線を低く配置：位置・画角・構造の説明</title><desc id="diagram-desc">カメラと構図の技術図。主題は箱で示す。数値のカメラ軸は未固定。人物・画風・完成投影の作画見本ではありません。</desc><rect width="1000" height="760" rx="18" fill="#f8fbfe"/><text x="38" y="52" font-size="31" fill="#233a52" text-anchor="start" font-family="sans-serif">水平線を低く配置</text><text x="38" y="92" font-size="23" fill="#536b80" text-anchor="start" font-family="sans-serif">位置・画角・構造の説明 / カメラ・構図の技術図</text><rect id="image-frame" x="150" y="165" width="700" height="430" rx="4" fill="#ffffff" stroke="#233a52" stroke-width="3"/><rect x="153" y="475" width="694" height="117" rx="4" fill="#e5ecf2" stroke="none" stroke-width="3"/><line id="horizon" x1="155" y1="475" x2="845" y2="475" stroke="#d38122" stroke-width="4"/><rect id="subject-shape" x="435" y="365" width="110" height="110" rx="4" fill="#dce8f1" stroke="#233a52" stroke-width="3"/><text x="150" y="650" font-size="23" fill="#536b80" text-anchor="start" font-family="sans-serif">水平線の画面内の高さ。数値ピッチは未固定</text><text x="38" y="715" font-size="23" fill="#536b80" text-anchor="start" font-family="sans-serif">箱は説明用の主題形。完成作品・人物・画風の見本ではありません。</text></svg>
