<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="diagram-title diagram-desc" data-diagram-kind="layout"><title id="diagram-title">鏡・水面越しの視点：位置・画角・構造の説明</title><desc id="diagram-desc">カメラと構図の技術図。主題は箱で示す。数値のカメラ軸は未固定。人物・画風・完成投影の作画見本ではありません。</desc><rect width="1000" height="760" rx="18" fill="#f8fbfe"/><text x="38" y="52" font-size="31" fill="#233a52" text-anchor="start" font-family="sans-serif">鏡・水面越しの視点</text><text x="38" y="92" font-size="23" fill="#536b80" text-anchor="start" font-family="sans-serif">位置・画角・構造の説明 / カメラ・構図の技術図</text><rect id="image-frame" x="150" y="165" width="700" height="430" rx="4" fill="#ffffff" stroke="#233a52" stroke-width="3"/><line id="reflection-plane" x1="500" y1="200" x2="500" y2="570" stroke="#066e99" stroke-width="4"/><rect id="original-shape" x="250" y="270" width="130" height="165" rx="4" fill="#dce8f1" stroke="#233a52" stroke-width="3"/><rect id="reflected-shape" x="620" y="270" width="130" height="165" rx="4" fill="#edf3f8" stroke="#536b80" stroke-width="3"/><line x1="380" y1="350" x2="620" y2="350" stroke="#536b80" stroke-width="4" stroke-dasharray="9 7"/><text x="255" y="470" font-size="23" fill="#233a52" text-anchor="start" font-family="sans-serif">対象</text><text x="620" y="470" font-size="23" fill="#233a52" text-anchor="start" font-family="sans-serif">反射像</text><text x="460" y="235" font-size="23" fill="#066e99" text-anchor="start" font-family="sans-serif">反射面</text><text x="150" y="650" font-size="23" fill="#536b80" text-anchor="start" font-family="sans-serif">同じ場所の反射面と、対応する元の対象</text><text x="38" y="715" font-size="23" fill="#536b80" text-anchor="start" font-family="sans-serif">箱は説明用の主題形。完成作品・人物・画風の見本ではありません。</text></svg>
