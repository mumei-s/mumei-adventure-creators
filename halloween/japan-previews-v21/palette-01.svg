<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img"><title>漆黒 × 琥珀 × 象牙</title><desc>漆黒を広い基調、琥珀を主題の色面、象牙を読み取りたい輪郭と最明部へ配分する</desc><rect x="0" width="360" height="400" fill="#100f14"/><rect x="360" width="180" height="400" fill="#ca862a"/><rect x="540" width="60" height="400" fill="#efe4d2"/></svg>