<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img"><title>深紅 × 黒 × 古金</title><desc>黒い基調から深紅の面を浮かせ、古金を狭い焦点へ置く。赤と黒の境界の明度を分ける</desc><rect x="0" width="240" height="400" fill="#9f213b"/><rect x="240" width="300" height="400" fill="#111018"/><rect x="540" width="60" height="400" fill="#ac9055"/></svg>