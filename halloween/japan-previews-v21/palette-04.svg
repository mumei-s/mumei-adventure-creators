<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img"><title>紫 × 黒 × 酸性グリーン</title><desc>黒を大面積、紫を副面、酸性グリーンを一点の視線誘導へ使い、緑で全域を覆わない</desc><rect x="0" width="180" height="400" fill="#8133a9"/><rect x="180" width="360" height="400" fill="#130f18"/><rect x="540" width="60" height="400" fill="#b7ee38"/></svg>