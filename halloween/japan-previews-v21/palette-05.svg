<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img"><title>藍墨 × 朱 × 和紙の白</title><desc>和紙白の基調に藍墨の主形を置き、朱を小さな一か所へ集約する。色名だけで和紙や筆跡は追加しない</desc><rect x="0" width="240" height="400" fill="#202f40"/><rect x="240" width="60" height="400" fill="#d04932"/><rect x="300" width="300" height="400" fill="#f4ead6"/></svg>