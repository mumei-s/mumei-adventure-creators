<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img"><title>桃色 × 墨黒 × 真珠</title><desc>桃色と墨黒を大きな面で隣り合わせ、真珠色を境界と焦点へ置く。真珠の物体は追加しない</desc><rect x="0" width="240" height="400" fill="#e6a9bc"/><rect x="240" width="240" height="400" fill="#24212b"/><rect x="480" width="120" height="400" fill="#f1e8e0"/></svg>