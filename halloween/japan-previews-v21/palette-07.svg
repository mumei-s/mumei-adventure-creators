<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img"><title>翡翠 × 銅 × 濃紺</title><desc>濃紺を最も広く、翡翠を主題の面、銅色を小さな暖色の対比へ割り当てる</desc><rect x="0" width="210" height="400" fill="#289c7a"/><rect x="210" width="90" height="400" fill="#af7651"/><rect x="300" width="300" height="400" fill="#172844"/></svg>