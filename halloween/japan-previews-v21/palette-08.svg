<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img"><title>白 × 白銀 × 氷青</title><desc>白の基調を氷青の明度差で分け、白銀色を最も明るい輪郭へ置く。影の深さは画風に合わせる</desc><rect x="0" width="360" height="400" fill="#fbfcfd"/><rect x="360" width="60" height="400" fill="#b7c9da"/><rect x="420" width="180" height="400" fill="#a9d8e9"/></svg>