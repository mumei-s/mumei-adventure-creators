<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img"><title>原色のポップカラー</title><desc>赤・青・黄から主色を一つ選び、残る二色は小さく置く。白黒を支持色にし、三色の等分の縞模様にしない</desc><rect x="0" width="270" height="400" fill="#e73439"/><rect x="270" width="120" height="400" fill="#264cb2"/><rect x="390" width="60" height="400" fill="#f2c626"/><rect x="450" width="120" height="400" fill="#f3f0e2"/><rect x="570" width="30" height="400" fill="#1b1b24"/></svg>