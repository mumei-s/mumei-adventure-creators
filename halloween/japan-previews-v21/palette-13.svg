<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img"><title>墨一色</title><desc>黒・白・無彩色の灰だけで明暗を構成する。墨の描画工程を採るかは画風に従い、配色名から別の筆致へ変えない</desc><rect x="0" width="240" height="400" fill="#161616"/><rect x="240" width="210" height="400" fill="#f7f7f7"/><rect x="450" width="150" height="400" fill="#838383"/></svg>