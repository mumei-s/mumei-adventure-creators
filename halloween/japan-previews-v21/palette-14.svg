<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img"><title>モノクローム</title><desc>黒・白・無彩色の灰だけを使い、異なる物体は明度と境界で分ける。有彩色の差し色を残さない</desc><rect x="0" width="240" height="400" fill="#161616"/><rect x="240" width="210" height="400" fill="#f7f7f7"/><rect x="450" width="150" height="400" fill="#838383"/></svg>