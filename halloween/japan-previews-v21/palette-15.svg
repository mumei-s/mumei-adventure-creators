<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img"><title>黒と白と朱の三色</title><desc>黒と白の面を主骨格にし、朱を画面の10%以下の一つの焦点へ置く。照明と反射もこの三色内で表す</desc><rect x="0" width="270" height="400" fill="#161616"/><rect x="270" width="270" height="400" fill="#f7f7f7"/><rect x="540" width="60" height="400" fill="#d94c39"/></svg>