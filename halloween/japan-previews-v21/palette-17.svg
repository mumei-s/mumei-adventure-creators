<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img"><title>セピア</title><desc>褐色の濃淡と紙色の明部だけで構成し、深い褐色を最暗部、薄い生成りを最明部に使う。青や赤を反射色として追加しない</desc><rect x="0" width="210" height="400" fill="#422c20"/><rect x="210" width="240" height="400" fill="#94735b"/><rect x="450" width="150" height="400" fill="#ebd7b6"/></svg>