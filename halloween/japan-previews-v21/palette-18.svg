<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img"><title>群青 × 菫 × 星白</title><desc>群青の大きな基調から菫の主形を分け、星白は小さな読み取り点へ置く。星を描く指示ではない</desc><rect x="0" width="360" height="400" fill="#121744"/><rect x="360" width="180" height="400" fill="#823ae2"/><rect x="540" width="60" height="400" fill="#edf4ff"/></svg>