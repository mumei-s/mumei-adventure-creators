<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img"><title>青緑 × 水色 × 銀</title><desc>深い青緑を基調、水色を主題の明部、銀を狭いアクセントに置く。海月や水中への場面変更はしない</desc><rect x="0" width="360" height="400" fill="#065a67"/><rect x="360" width="180" height="400" fill="#76d8e5"/><rect x="540" width="60" height="400" fill="#ddeaf2"/></svg>