<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img"><title>朱赤 × 琥珀 × 金</title><desc>朱赤の深い面に琥珀色の広い明部を接し、金色は狭い接点に集める。赤と黄を全域で混ぜて橙一色にしない</desc><rect x="0" width="300" height="400" fill="#9d291b"/><rect x="300" width="240" height="400" fill="#f9a733"/><rect x="540" width="60" height="400" fill="#ffe09c"/></svg>