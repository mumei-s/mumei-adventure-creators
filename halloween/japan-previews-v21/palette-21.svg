<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img"><title>夜紺 × 翡翠 × 蛍光緑</title><desc>夜紺を基調、翡翠を読み取る主色、蛍光緑を小さな焦点にする。夜景や発光を色名だけで追加しない</desc><rect x="0" width="390" height="400" fill="#111b35"/><rect x="390" width="150" height="400" fill="#0b9f7d"/><rect x="540" width="60" height="400" fill="#adf7a3"/></svg>