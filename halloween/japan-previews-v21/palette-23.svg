<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img"><title>薄紫 × ミント × 氷銀</title><desc>薄紫を最も広く、ミントを主題との対比、氷銀を狭い明部にする。極光やリボンそのものは加えない</desc><rect x="0" width="300" height="400" fill="#8772c7"/><rect x="300" width="210" height="400" fill="#9ce1c9"/><rect x="510" width="90" height="400" fill="#e5f2fa"/></svg>