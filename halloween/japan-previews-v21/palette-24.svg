<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img"><title>真珠白 × 桜 × 玉虫色</title><desc>真珠白の大きな面に桜色を重ねず隣接させ、玉虫色は小さな色変化の領域へ置く。反射の方法は画風が決める</desc><rect x="0" width="360" height="400" fill="#f2ede5"/><rect x="360" width="150" height="400" fill="#f0bcd6"/><rect x="510" width="90" height="400" fill="#86c9bd"/></svg>