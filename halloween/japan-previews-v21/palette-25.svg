<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img"><title>墨黒 × 溶岩朱 × 火花金</title><desc>墨黒の広い基調に溶岩朱の主形と火花金の小面積を対比させる。炎や火花の物体を自動生成しない</desc><rect x="0" width="390" height="400" fill="#130f13"/><rect x="390" width="150" height="400" fill="#e74a25"/><rect x="540" width="60" height="400" fill="#ffcf64"/></svg>