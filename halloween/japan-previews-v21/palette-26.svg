<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img"><title>桃 × ミルク × 淡金</title><desc>桃色とミルク色を広い二つの面へ分け、淡金を小さな焦点へ使う。淡色でも画風に必要な暗部を削らない</desc><rect x="0" width="270" height="400" fill="#f0b5af"/><rect x="270" width="270" height="400" fill="#fff0dc"/><rect x="540" width="60" height="400" fill="#dcbc87"/></svg>