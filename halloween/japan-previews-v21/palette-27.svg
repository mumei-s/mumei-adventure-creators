<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img"><title>くすみ薔薇 × セージ × 象牙</title><desc>くすみ薔薇を主色、セージを対比する副色、象牙を明部に配置する。低彩度を保ちつつ境界の明度を分ける</desc><rect x="0" width="240" height="400" fill="#b88491"/><rect x="240" width="180" height="400" fill="#8a9c84"/><rect x="420" width="180" height="400" fill="#ede1cf"/></svg>