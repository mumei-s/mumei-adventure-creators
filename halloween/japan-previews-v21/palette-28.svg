<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img"><title>ラベンダー × 粉青 × ミルク</title><desc>ラベンダーと粉青を主題と周囲の面に割り当て、ミルクを明部へ使う。霞で全体を一様に白くしない</desc><rect x="0" width="240" height="400" fill="#b8a5d5"/><rect x="240" width="210" height="400" fill="#b0c9e5"/><rect x="450" width="150" height="400" fill="#faf0e7"/></svg>