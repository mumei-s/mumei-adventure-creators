<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img"><title>珊瑚 × アクア × 白</title><desc>アクアを基調、珊瑚を温かい主題の面、白を狭い分離領域へ置き、寒暖の位置を明確にする</desc><rect x="0" width="210" height="400" fill="#f18b7e"/><rect x="210" width="270" height="400" fill="#76d2d3"/><rect x="480" width="120" height="400" fill="#faf4e4"/></svg>