<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img"><title>杏 × モーヴ × 夕焼け金</title><desc>杏を温かい面、モーヴを隣り合う対比、夕焼け金を小さな明部へ使う。実際の時刻は舞台と主題に従う</desc><rect x="0" width="270" height="400" fill="#e99e6c"/><rect x="270" width="240" height="400" fill="#8c687e"/><rect x="510" width="90" height="400" fill="#f7d487"/></svg>