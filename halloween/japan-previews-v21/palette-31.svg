<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img"><title>白磁 × 霧青 × 淡金</title><desc>白磁の基調を霧青で分け、淡金は小さな識別点へ置く。霧や陶器の材質を配色から追加しない</desc><rect x="0" width="390" height="400" fill="#edece5"/><rect x="390" width="150" height="400" fill="#adc3d5"/><rect x="540" width="60" height="400" fill="#cbb684"/></svg>