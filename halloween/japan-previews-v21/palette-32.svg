<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img"><title>くすみ青 × 炭 × 霧白</title><desc>くすみ青を主色、炭色を暗い輪郭と奥、霧白を明部へ置く。三つの明度帯を潰さず低彩度で分離する</desc><rect x="0" width="300" height="400" fill="#728b9f"/><rect x="300" width="180" height="400" fill="#303741"/><rect x="480" width="120" height="400" fill="#dce1e3"/></svg>