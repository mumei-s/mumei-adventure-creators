<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img"><title>モーヴ × モカ × オートミール</title><desc>モーヴとオートミールの広い面をモカの深い領域で区切る。毛糸や繊維の質感を配色から追加しない</desc><rect x="0" width="210" height="400" fill="#ad8a96"/><rect x="210" width="180" height="400" fill="#7b5d52"/><rect x="390" width="210" height="400" fill="#ded2b9"/></svg>