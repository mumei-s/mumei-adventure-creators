<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img"><title>群青 × 酸性黄 × 白</title><desc>群青の大きな面に酸性黄の小さめの形を置き、白は分離と読み取りに絞る。補色を等面積にしない</desc><rect x="0" width="390" height="400" fill="#193abc"/><rect x="390" width="150" height="400" fill="#e8ed19"/><rect x="540" width="60" height="400" fill="#fffbe7"/></svg>