<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img"><title>翡翠 × マゼンタ × 黒</title><desc>翡翠を主面、マゼンタを副面、黒を両色の分離へ使う。二つの有彩色を全面に細かく交互配置しない</desc><rect x="0" width="270" height="400" fill="#058865"/><rect x="270" width="180" height="400" fill="#d62692"/><rect x="450" width="150" height="400" fill="#17151c"/></svg>