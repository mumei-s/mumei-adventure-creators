<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img"><title>橙 × ターコイズ × コバルト</title><desc>橙とターコイズを大きな二領域に分け、コバルトを奥と焦点の輪郭へ使う。カボチャを追加する色指定ではない</desc><rect x="0" width="240" height="400" fill="#ff8e22"/><rect x="240" width="240" height="400" fill="#18bcba"/><rect x="480" width="120" height="400" fill="#244ea4"/></svg>