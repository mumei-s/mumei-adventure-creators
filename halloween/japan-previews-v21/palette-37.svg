<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img"><title>深紅 × 氷青 × 黒</title><desc>黒を基調、深紅を温かい主面、氷青を冷たい対比へ配分する。赤と青を混ぜた紫一色へ戻さない</desc><rect x="0" width="210" height="400" fill="#a92343"/><rect x="210" width="150" height="400" fill="#a6e9f2"/><rect x="360" width="240" height="400" fill="#111b27"/></svg>