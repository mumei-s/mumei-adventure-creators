<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img"><title>菫 × マンゴー × 白</title><desc>菫の大面にマンゴー色を副面として置き、白を狭い明部へ絞る。食べ物や花は追加しない</desc><rect x="0" width="300" height="400" fill="#7541b7"/><rect x="300" width="210" height="400" fill="#ffba45"/><rect x="510" width="90" height="400" fill="#fff2e4"/></svg>