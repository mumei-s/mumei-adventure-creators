<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img"><title>王青 × 銅 × 生成り</title><desc>王青を基調、銅を暖かい対比、生成りを明部へ使う。金属反射を加えるかは画風と衣装が決める</desc><rect x="0" width="330" height="400" fill="#204997"/><rect x="330" width="150" height="400" fill="#b97048"/><rect x="480" width="120" height="400" fill="#eadcc3"/></svg>