<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img"><title>レモン × ライム × 炭黒</title><desc>炭黒を大きく取り、ライムを副色、レモンを最も小さく明るい焦点へ置く。電波や火花は自動追加しない</desc><rect x="0" width="90" height="400" fill="#f1e34d"/><rect x="90" width="150" height="400" fill="#92cf38"/><rect x="240" width="360" height="400" fill="#24242b"/></svg>