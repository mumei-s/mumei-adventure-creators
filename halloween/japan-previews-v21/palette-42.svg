<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img"><title>サフラン × 藍 × 和紙白</title><desc>藍を基調、サフランを温かい対比、和紙白を明部へ割り当てる。糸の織りや紙目は画風に委ねる</desc><rect x="0" width="210" height="400" fill="#d7a02f"/><rect x="210" width="240" height="400" fill="#26366c"/><rect x="450" width="150" height="400" fill="#eee2c9"/></svg>