<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img"><title>朱 × 青磁 × 煤黒</title><desc>青磁を主面、朱を副面、煤黒を輪郭と奥へ配分する。和風の衣装や道具を色から決めない</desc><rect x="0" width="180" height="400" fill="#c94331"/><rect x="180" width="270" height="400" fill="#94b8a1"/><rect x="450" width="150" height="400" fill="#292423"/></svg>