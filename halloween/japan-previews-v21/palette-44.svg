<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img"><title>葡萄 × 羊皮紙 × 古金</title><desc>葡萄色と羊皮紙色を大きな面で対比させ、古金を小さな識別点へ絞る。本や古紙そのものは追加しない</desc><rect x="0" width="270" height="400" fill="#682f4b"/><rect x="270" width="240" height="400" fill="#dec7a3"/><rect x="510" width="90" height="400" fill="#ae904b"/></svg>