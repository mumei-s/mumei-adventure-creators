<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img"><title>紺 × 淡金 × 白</title><desc>紺の大きな基調、淡金の副面、白の狭い明部を保つ。図形や紋章は配色から追加しない</desc><rect x="0" width="360" height="400" fill="#152e4e"/><rect x="360" width="150" height="400" fill="#c9ab60"/><rect x="510" width="90" height="400" fill="#f4edda"/></svg>