<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img"><title>くすみシアン × 錆 × 象牙</title><desc>くすみシアンと錆色を別々の面へ置き、象牙を明部に使う。版ずれとインクの粒子は対応する画風でだけ表現する</desc><rect x="0" width="240" height="400" fill="#569ca0"/><rect x="240" width="210" height="400" fill="#b56646"/><rect x="450" width="150" height="400" fill="#efe0c5"/></svg>