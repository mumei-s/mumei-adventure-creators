<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img"><title>瓶緑 × 黄土 × 革茶</title><desc>瓶緑の主面に黄土と革茶を小さな面として配置し、暗い緑と茶の境界を明度で分ける。森や地図を追加しない</desc><rect x="0" width="300" height="400" fill="#28584b"/><rect x="300" width="150" height="400" fill="#b38d36"/><rect x="450" width="150" height="400" fill="#a27452"/></svg>