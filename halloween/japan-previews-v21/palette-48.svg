<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img"><title>灰 × 銀 × 一点の赤</title><desc>灰と銀で画面の95%を構成し、赤を一つの小さなアクセントに限定する。赤い光を全体へ拡散しない</desc><rect x="0" width="360" height="400" fill="#3d414b"/><rect x="360" width="210" height="400" fill="#cbd0d5"/><rect x="570" width="30" height="400" fill="#ee253e"/></svg>