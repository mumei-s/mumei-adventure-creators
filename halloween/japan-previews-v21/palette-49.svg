<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img"><title>焦茶 × シアン光</title><desc>焦茶の濃淡を75%、シアンを25%に配分する。二つの色相だけで明部と暗部を作り、別の色を反射にも加えない</desc><rect x="0" width="450" height="400" fill="#392725"/><rect x="450" width="150" height="400" fill="#42bccd"/><rect x="600" width="NaN" height="400" fill="#a48668"/></svg>